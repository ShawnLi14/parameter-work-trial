[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review-bench"
version = "0.1.0"
description = "Security review benchmark built from real upstream PRs, and a baseline reviewer"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
benchmark = "benchmark.cli:main"
security-review = "reviewer.cli:main"

[tool.setuptools.package-data]
benchmark = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["benchmark*", "reviewer*"]
