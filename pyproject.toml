[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review-bench"
version = "0.1.0"
description = "Source-backed security benchmark and external-agent harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
secbench = "secbench.cli:main"

[tool.setuptools.package-data]
secbench = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["secbench*"]
