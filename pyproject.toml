[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review-bench"
version = "0.1.0"
description = "Security review benchmark built from real upstream PRs, and security PR reviewers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only the Claude provider needs a third-party package.
claude = ["anthropic>=2"]

[project.scripts]
benchmark = "benchmark.cli:main"
review-single-call = "reviewer.run:single_call"
review-find-verify = "reviewer.run:find_verify"
review-self-improving = "reviewer.run:self_improving"

[tool.setuptools.package-data]
benchmark = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["benchmark*", "reviewer*"]
